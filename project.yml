name: OpenTS
options:
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  base:
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "Use your microphone to test the input level or speak in a TeamSpeak channel."
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    OTHER_LDFLAGS: "$(inherited) -framework Security -framework SystemConfiguration -framework CoreFoundation -lc++ -lz -liconv"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targetTemplates:
  Client:
    type: application
    sources:
      - path: Apple
        excludes: ["Generated/*.h", "Generated/*.modulemap"]
    dependencies:
      - framework: build/OpenTSCore.xcframework
        embed: false
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: OpenTS
targets:
  OpenTS-macOS:
    templates: [Client]
    platform: macOS
    dependencies:
      - package: Sparkle
    info:
      path: Config/macOS-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        SUEnableSystemProfiling: false
        SUFeedURL: https://github.com/opents-project/opents-apple/releases/download/appcast/appcast.xml
        SUPublicEDKey: "$(OPENTS_SPARKLE_PUBLIC_KEY)"
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.opents.macos
        OPENTS_SPARKLE_PUBLIC_KEY: ""
    configFiles:
      Debug: Config/macOS-Debug.xcconfig
  OpenTS-iOS:
    templates: [Client]
    platform: iOS
    info:
      path: Config/iOS-Info.plist
      properties:
        UIBackgroundModes: [audio]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.opents.ios
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "OpenTS uses your local network to connect to the TeamSpeak server you choose on that network."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
