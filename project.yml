name: OpenTS
options:
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  base:
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "Use your microphone to test the input level or speak in a TeamSpeak channel."
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    OTHER_LDFLAGS: "$(inherited) -framework Security -framework SystemConfiguration -framework CoreFoundation -lc++ -lz -liconv"
targetTemplates:
  Client:
    type: application
    sources:
      - path: Apple
        excludes: ["Generated/*.h", "Generated/*.modulemap"]
    dependencies:
      - framework: build/OpenTSCore.xcframework
        embed: false
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: OpenTS
        PRODUCT_BUNDLE_IDENTIFIER: org.opents-project.opents
targets:
  OpenTS-macOS:
    templates: [Client]
    platform: macOS
    configFiles:
      Debug: Config/macOS-Debug.xcconfig
  OpenTS-iOS:
    templates: [Client]
    platform: iOS
    info:
      path: Config/iOS-Info.plist
      properties:
        UIBackgroundModes: [audio]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "OpenTS uses your local network to connect to the TeamSpeak server you choose on that network."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
